[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vcf-merger"
version = "0.2.0"
description = "Standards-aware VCF normalization, evidence aggregation, and harmonization"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Furkan Emre Bora" }]
keywords = ["vcf", "bioinformatics", "variant-calling", "harmonization", "ensemble"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pysam>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
reports = [
    "pandas>=1.5.0",
]

[project.scripts]
vcf-merger = "vcf_merger.cli:main"

[project.urls]
Homepage = "https://github.com/femrebora/vcf-merger"
Repository = "https://github.com/femrebora/vcf-merger"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "bcftools: tests that require bcftools on PATH",
    "performance: performance / benchmark tests",
]

[tool.coverage.run]
source = ["vcf_merger"]
branch = true
