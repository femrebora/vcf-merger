[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phelix-vault"
version = "0.1.0"
description = "Secure genomic data governance and storage layer for the pHelix clinical genomics ecosystem"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Furkan Emre Bora" }]
keywords = ["genomics", "governance", "vault", "clinical", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "boto3>=1.34.0",
    "ulid-py>=1.1.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-boto3>=1.0.2",
]

[project.scripts]
phelix-vault = "phelix_vault.main:run"

[project.urls]
Homepage = "https://github.com/femrebora/phelix-vault"
Repository = "https://github.com/femrebora/phelix-vault"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "integration: tests that need filesystem/object storage",
    "security: security-oriented invariant tests",
]

[tool.coverage.run]
source = ["phelix_vault"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "UP042",  # str Enum retained for broader serialization clarity
    "B008",   # FastAPI Depends/File/Form defaults are idiomatic
]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["phelix_vault"]
mypy_path = "src"
ignore_missing_imports = true
