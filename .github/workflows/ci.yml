name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bcftools tabix samtools
      - name: Install package
        run: |
          pip install -e ".[dev]"
      - name: Test
        run: |
          pytest -q
